<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05" />
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(30px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(30px) rotate(-360deg); }
      }

      .bg-grid { opacity: 0.12; stroke: #38bdf8; stroke-width: 0.5; }
      .dynamic-pill-left { animation: floatSlow 7s ease-in-out infinite; }
      .dynamic-pill-right { animation: floatReverse 8s ease-in-out infinite; }
      .dynamic-pulse { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .network-line { stroke: url(#accentGrad); stroke-width: 1.5; stroke-dasharray: 6 6; animation: dashMove 14s linear infinite; opacity: 0.45; }
      .subtle-node { fill: #38bdf8; animation: orbit 9s linear infinite; }
    </style>
  </defs>

  <!-- Deep Cosmic Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Geometric Grid Layer -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Animated Background Decentralized Network Mesh Lines -->
  <path d="M 60 70 Q 280 120 420 80 T 800 110 T 1140 60" fill="none" class="network-line" />
  <path d="M 80 340 Q 320 290 600 330 T 960 300 T 1150 350" fill="none" class="network-line" style="animation-duration: 20s;" />

  <!-- Ambient Pulsing Glow Orbs -->
  <circle cx="220" cy="190" r="140" fill="url(#glowGrad)" class="dynamic-pulse" />
  <circle cx="980" cy="200" r="160" fill="url(#glowGrad)" class="dynamic-pulse" style="animation-delay: -2s;" />

  <!-- Dynamic Aspect: Background Decorative Card / Pill Elements -->
  <g class="dynamic-pill-left">
    <!-- DID Smart Badge -->
    <g transform="translate(60, 110)">
      <rect width="180" height="44" rx="22" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow)"/>
      <circle cx="24" cy="22" r="7" fill="#38bdf8" filter="url(#glowEffect)"/>
      <text x="42" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">did:key &amp; did:web</text>
    </g>
    <!-- Verifiable Credential Pill -->
    <g transform="translate(40, 240)">
      <rect width="210" height="44" rx="22" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2" filter="url(#shadow)"/>
      <circle cx="24" cy="22" r="7" fill="#818cf8" filter="url(#glowEffect)"/>
      <text x="42" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">W3C Verifiable Credentials</text>
    </g>
  </g>

  <g class="dynamic-pill-right">
    <!-- Zero Knowledge Proof Pill -->
    <g transform="translate(950, 110)">
      <rect width="190" height="44" rx="22" fill="#1e293b" fill-opacity="0.85" stroke="#c084fc" stroke-width="1.2" filter="url(#shadow)"/>
      <circle cx="24" cy="22" r="7" fill="#c084fc" filter="url(#glowEffect)"/>
      <text x="42" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">ZKP &amp; Selective Disclosure</text>
    </g>
    <!-- Self-Sovereign Identity Pill -->
    <g transform="translate(930, 240)">
      <rect width="210" height="44" rx="22" fill="#1e293b" fill-opacity="0.85" stroke="#2dd4bf" stroke-width="1.2" filter="url(#shadow)"/>
      <circle cx="24" cy="22" r="7" fill="#2dd4bf" filter="url(#glowEffect)"/>
      <text x="42" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">Self-Sovereign Identity</text>
    </g>
  </g>

  <!-- FOREGROUND: Prominent Title, Subtitle, and Categorical Accents -->
  <!-- Top Category Capsule -->
  <g transform="translate(470, 75)">
    <rect width="260" height="30" rx="15" fill="#111827" fill-opacity="0.95" stroke="url(#accentGrad)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="130" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">AWESOME PROTOCOLS ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#shadow)">
    Web3 &amp; Decentralized Identity
  </text>

  <!-- Gradient Sub-bar -->
  <rect x="420" y="185" width="360" height="4" rx="2" fill="url(#accentGrad)" filter="url(#glowEffect)"/>

  <!-- Subtitle Line 1 -->
  <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.4">
    Curated Hub of Self-Sovereign Identity (SSI) • Verifiable Credentials • DIDs • ZK Attestations
  </text>

  <!-- Subtitle Line 2 / Feature Tags -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <!-- Tag 1 -->
    <rect x="-240" y="-14" width="105" height="28" rx="6" fill="#1f2937" fill-opacity="0.8" stroke="#374151" stroke-width="1"/>
    <text x="-187" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ W3C VCs</text>
    
    <!-- Tag 2 -->
    <rect x="-120" y="-14" width="105" height="28" rx="6" fill="#1f2937" fill-opacity="0.8" stroke="#374151" stroke-width="1"/>
    <text x="-67" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ SIWE</text>

    <!-- Tag 3 -->
    <rect x="5" y="-14" width="115" height="28" rx="6" fill="#1f2937" fill-opacity="0.8" stroke="#374151" stroke-width="1"/>
    <text x="62" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔐 OpenID4VC</text>

    <!-- Tag 4 -->
    <rect x="135" y="-14" width="105" height="28" rx="6" fill="#1f2937" fill-opacity="0.8" stroke="#374151" stroke-width="1"/>
    <text x="187" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 mDL &amp; eIDAS</text>
  </g>
</svg>
